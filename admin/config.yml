backend:
  name: git-gateway
  branch: main

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "portfolio"
    label: "Portfolio"
    folder: "portfolio"
    create: true
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Image/Vidéo", name: "media", widget: "image"}
      - {label: "Description", name: "body", widget: "markdown"}
